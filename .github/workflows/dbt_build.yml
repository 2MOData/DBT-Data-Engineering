name: dbt build & publish
on:
  push:
    branches: [main]
    paths:
      - 'project_1/**'
      - '.github/workflows/dbt_build.yml'
  schedule:
    - cron: '17 6 * * 1'    # Mondays — the pipeline runs while you sleep
  workflow_dispatch:        # …and a manual Run button
permissions:
  contents: write           # lets the workflow update the release
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project_1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/download_data.py
      - run: uv run dbt build --profiles-dir ../ci
        working-directory: project_1/analytics
      - run: |
          uv run --with duckdb==1.5.5 python - <<'PY'
          import duckdb
          con = duckdb.connect('../data/prod.duckdb')
          con.execute('CREATE TABLE job_postings__tbl AS SELECT * FROM job_postings')
          con.execute('DROP VIEW job_postings')
          con.execute('ALTER TABLE job_postings__tbl RENAME TO job_postings')
          con.close()
          PY
        working-directory: project_1/analytics
      - run: |
          gh release create warehouse --notes "Warehouse — auto-built by dbt" || true
          gh release upload warehouse data/prod.duckdb --clobber
        env:
          GH_TOKEN: ${{ github.token }}